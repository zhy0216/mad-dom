[package]
name = "mad-dom-parser-selector-string-spike"
version = "0.0.1-alpha.0"
edition = "2021"
license = "MIT"
description = "Isolated HTML parser / selector engine / string-storage spike for mad-dom (T05); excluded from the workspace, carries no production DOM semantics."
publish = false

[dependencies]
# HTML parser candidate: servo html5ever (MIT OR Apache-2.0).
# TreeSink lets us stream tokens straight into a custom storage backend.
html5ever = "0.39.0"
# Selector engine candidate: servo selectors (MPL-2.0) + cssparser (MPL-2.0).
# Matching is dispatched through the Element trait against any tree, no mirror tree required.
selectors = "0.40.0"
cssparser = "0.37.0"
# Tiny helper used by selectors' SelectorImpl bounds.
precomputed-hash = "0.1.1"
