[package]
name = "mad-dom-binding-spike"
version = "0.0.1-alpha.0"
edition = "2021"
license = "MIT"
description = "Isolated Bun/Node-API binding spike for mad-dom (T04); excluded from the workspace, carries no DOM semantics."
publish = false

[lib]
name = "mad_dom_binding_spike"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.2", features = ["napi4"] }
napi-derive = "3.6.3"
