[workspace]
resolver = "2"
members = [
    "crates/mad-dom-core",
    "crates/mad-dom-bun",
]
# T04 绑定原型独立于 workspace，保证 `cargo fmt/clippy/test --workspace`
# 只覆盖生产 crates（见 adr/0003-native-binding-spike.md）。
# T05 解析器/选择器/字符串存储原型同理（见 adr/0004-*）。
exclude = [
    "spikes/native-binding",
    "spikes/parser-selector-string",
]

[workspace.package]
version = "0.0.1-alpha.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mad-dom-core = { path = "crates/mad-dom-core" }
