name: Release

# T49 native release build (ADR-0005 §3, §7, §10). Builds the platform matrix on
# native runners, runs the install smoke per platform, verifies checksums, and
# (only when explicitly authorized) publishes: every platform package first, a
# registry integrity check, then the main package last. Nothing is published by
# default — `dry_run` defaults to true and `publish` additionally requires the
# release script's MAD_DOM_ALLOW_PUBLISH guard.
#
# Stage → shipped platform set (ADR-0005 §2):
#   alpha  — darwin-arm64, darwin-x64, linux-x64-gnu, linux-arm64-gnu
#            (win32-x64 and the musl targets are deferred to beta);
#   beta   — the full 7-platform matrix;
#   stable — the full matrix (the stable gate, T50, owns the final dist-tag
#            migration to `latest`).

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Release stage (alpha / beta / stable)"
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - stable
      version:
        description: "Version to release (default: package.json version)"
        required: false
        type: string
      dry_run:
        description: "Rehearsal only — build, pack, checksum and print the publish plan without touching the registry"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write # npm provenance (ADR-0005 §7)

env:
  CARGO_BUILD_JOBS: 3

jobs:
  runtime-validation:
    uses: ./.github/workflows/ci.yml

  build:
    needs: runtime-validation
    name: "Build + install smoke: ${{ matrix.platform }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            triple: aarch64-apple-darwin
            runner: macos-14
          - platform: darwin-x64
            triple: x86_64-apple-darwin
            runner: macos-15-intel # the install smoke must run on an x86_64 host (macos-latest is arm64)
          - platform: linux-x64-gnu
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - platform: linux-arm64-gnu
            triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - platform: win32-x64
            triple: x86_64-pc-windows-msvc
            runner: windows-latest
          - platform: linux-x64-musl
            triple: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - platform: linux-arm64-musl
            triple: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      # "jobs.<id>.if" cannot see the matrix context, so gate per-variant here:
      # alpha ships darwin/linux-gnu only (ADR-0005 §2).
      - name: Gate alpha platform set
        id: gate
        shell: bash
        run: |
          p="${{ matrix.platform }}"
          if [ "${{ inputs.stage }}" = "alpha" ] && { [ "$p" = "win32-x64" ] || [[ "$p" == *musl* ]]; }; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        if: steps.gate.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.triple }} # macos-latest is arm64, so darwin-x64 is a real cross-target

      - name: Record the runner glibc floor (docs/release.md TBD backfill)
        if: steps.gate.outputs.skip != 'true' && contains(matrix.platform, '-gnu')
        shell: bash
        run: ldd --version | head -n 1

      - name: Add musl cross toolchain
        if: steps.gate.outputs.skip != 'true' && contains(matrix.platform, 'musl')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.triple }}

      - name: Install latest stable Bun
        if: steps.gate.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pinned dependencies
        if: steps.gate.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Resolve release version
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="$(bun -p 'process.env.REQUESTED_VERSION || require("./package.json").version')"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the platform package
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: bun scripts/build-platform-package.mjs --triple ${{ matrix.triple }} --version "$RELEASE_VERSION"

      - name: Pack the platform package tarball
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          pkg_dir="build/platform/@mad-dom/platform-${{ matrix.platform }}"
          mkdir -p build/smoke
          npm pack "$pkg_dir" --pack-destination build/smoke --json

      - name: Run install smoke on the native runner
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          tgz="build/smoke/mad-dom-platform-${{ matrix.platform }}-${RELEASE_VERSION}.tgz"
          bun scripts/install-smoke.mjs --platform-tgz "$tgz" --version "$RELEASE_VERSION"

      - name: Record platform runtime diagnostics
        if: always() && steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p build/diagnostics
          bun run report:runtime > build/diagnostics/runtime.json
      - name: Upload platform smoke evidence
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.platform }}
          path: |
            build/diagnostics/*.json
            build/smoke/runtime-results.json

      - name: Upload platform package
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.platform }}
          path: build/platform # keeps the @mad-dom/ scope level the release script expects
          if-no-files-found: error

  verify:
    name: "Verify checksums + release plan (${{ inputs.stage || 'alpha' }})"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install latest stable Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pinned dependencies
        run: bun install --frozen-lockfile

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: build/release/platform
          merge-multiple: true
          pattern: platform-*

      - name: "Rehearse the release (pack + checksums + ordered plan)"
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          MAD_DOM_ALLOW_PUBLISH: ${{ !inputs.dry_run && '1' || '0' }}
        run: |
          version="$(bun -p 'process.env.REQUESTED_VERSION || require("./package.json").version')"
          stage="${{ inputs.stage || 'alpha' }}"
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            bun scripts/release.mjs publish --stage "$stage" --version "$version" --no-build --no-dry-run
          else
            bun scripts/release.mjs draft --stage "$stage" --version "$version" --no-build
          fi

      - name: Upload release draft and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-draft
          path: |
            build/release/runtime-metadata.json
            build/release/SHASUMS256.txt
            build/release/tgz/*.tgz
