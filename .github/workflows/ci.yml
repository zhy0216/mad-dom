name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 3

jobs:
  validate:
    name: Validate (${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: [latest, baseline]
    env:
      MAD_DOM_CI_LANE: ${{ matrix.bun }}
      MAD_DOM_NATIVE_PATH: ${{ github.workspace }}/build/mad-dom.node
      MAD_DOM_FFI_PATH: ${{ github.workspace }}/build/mad-dom.node
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - name: Resolve latest stable Bun
        if: matrix.bun == 'latest'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reproduce baseline Bun
        if: matrix.bun == 'baseline'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Record actual versions
        run: |
          bun --version
          bun --revision
          rustc --version
          mkdir -p build/ci
          bun run report:runtime > build/ci/runtime-before-build.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check JavaScript and Rust
        run: |
          bun run check
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Build native binding from this checkout
        run: bun run dev:build
      - name: Probe capabilities and native ABI
        run: |
          bun run report:runtime --require-native > build/ci/runtime.json
          bun run probe:bun:selftest
          bun run test:native
      - name: Prepare generated compatibility assets
        run: bun run compat:hdunit:rewrite
      - name: Run native, compatibility and WPT gates
        run: |
          bun run compat:types
          bun run test
          bun run compat:ledger
          bun run compat:hdunit:validate
          bun run wpt:test
      - name: Verify vendored hdunit source
        run: |
          git clone --quiet --depth 1 --branch v20.11.11 https://github.com/capricorn86/happy-dom /tmp/happy-dom-upstream
          HAPPY_DOM_UPSTREAM_DIR=/tmp/happy-dom-upstream bun scripts/vendor-happy-dom-tests.mjs --verify
      - name: Install locked integration dependencies
        working-directory: benchmark/mad-dom-integration-test
        run: bun install --frozen-lockfile
      - name: Run integration suite
        run: bun run test:integration
      - name: Benchmark sanity and regression gate
        run: |
          bun run bench:check
          bun run bench:bun-native:selftest
          bun run bench:bun-io:selftest
          bun run bench:dom --runs 1 --sizes 0.01
      - name: Validate workflows and documentation
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          bun run docs:build
      - name: Rehearse release and real tarball installs
        run: |
          bun run platform:build --artifact build/mad-dom.node --out build/release/platform
          bun run release:draft --no-build
          version="$(bun -p 'require("./package.json").version')"
          bun run smoke:install --main-tgz "build/release/tgz/mad-dom-${version}.tgz" --platform-tgz "build/release/tgz/mad-dom-platform-linux-x64-gnu-${version}.tgz"
          MAD_DOM_FFI_DISABLED=1 bun run platform:build --artifact build/mad-dom.node --out build/release-node-api/platform
          bun run release:draft --no-build --out build/release-node-api
          bun run smoke:install --out build/smoke-node-api --main-tgz "build/release-node-api/tgz/mad-dom-${version}.tgz" --platform-tgz "build/release-node-api/tgz/mad-dom-platform-linux-x64-gnu-${version}.tgz"
      - name: Record diagnostics even after a failed gate
        if: always()
        run: |
          mkdir -p build/ci
          bun run report:runtime > build/ci/runtime-final.json
      - name: Upload runtime and release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.bun }}
          path: |
            build/ci/*.json
            build/release*/runtime-metadata.json
            build/release*/SHASUMS256.txt
            build/smoke*/runtime-results.json

  safety:
    name: Safety (unsafe inventory + Miri + ASan)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Install nightly with Miri
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: miri

      - name: Check the unsafe/FFI inventory
        run: bash scripts/check-core-safety.sh scan

      - name: Run Miri representative subset (mad-dom-core)
        run: bash scripts/check-core-safety.sh miri

      - name: Run AddressSanitizer smoke (mad-dom-core)
        run: bash scripts/check-core-safety.sh asan

      - name: Run the Core property and stress suite at native speed
        run: cargo test -p mad-dom-core
