name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Install pinned Bun version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install pinned dependencies
        run: npm ci

      - name: Check JavaScript entry
        run: bun --check index.js

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Build native binding (dev artifact)
        run: npm run dev:build

      - name: Run Bun tests (including native binding smoke tests)
        run: bun test tests/bun

      - name: Validate compatibility ledger (regression gate)
        run: npm run compat:ledger

      - name: Validate hdunit suite (vendor/rewrite idempotency + triage gate)
        run: |
          git clone --quiet --depth 1 --branch v20.11.11 https://github.com/capricorn86/happy-dom /tmp/happy-dom-upstream
          HAPPY_DOM_UPSTREAM_DIR=/tmp/happy-dom-upstream bun scripts/vendor-happy-dom-tests.mjs --verify
          bun scripts/rewrite-happy-dom-tests.mjs --verify
          npm run compat:hdunit:validate

      - name: Smoke test package packing
        run: npm pack --dry-run

  install-smoke:
    name: Install smoke (host platform, no Cargo)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Install pinned Bun version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install pinned dependencies
        run: npm ci

      - name: Build the host platform package
        run: bun scripts/build-platform-package.mjs

      - name: Pack the platform package tarball
        run: |
          pkg_name="$(bun -e 'import { platformInfo, platformPackageName } from "./js/native-loader.js"; const i = platformInfo(); console.log(platformPackageName(i.platform, i.arch, i.libc));')"
          echo "platform package: ${pkg_name}"
          mkdir -p build/smoke
          npm pack "build/platform/${pkg_name}" --pack-destination build/smoke --json

      - name: Run install smoke (packed package, no Cargo environment)
        run: |
          version="$(node -p "require('./package.json').version")"
          bun scripts/install-smoke.mjs --platform-tgz "build/smoke/mad-dom-platform-linux-x64-gnu-${version}.tgz"

  safety:
    name: Safety (unsafe inventory + Miri + ASan)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Install nightly with Miri
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: miri

      - name: Check the unsafe/FFI inventory
        run: bash scripts/check-core-safety.sh scan

      - name: Run Miri representative subset (mad-dom-core)
        run: bash scripts/check-core-safety.sh miri

      - name: Run AddressSanitizer smoke (mad-dom-core)
        run: bash scripts/check-core-safety.sh asan

      - name: Run the Core property and stress suite at native speed
        run: cargo test -p mad-dom-core

  integration:
    name: Integration test (benchmark mad-dom suite)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Install pinned Bun version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install pinned dependencies
        run: npm ci

      - name: Build native binding (dev artifact)
        run: npm run dev:build

      - name: Install mad-dom integration-test dependencies
        run: bun install --frozen-lockfile
        working-directory: benchmark/mad-dom-integration-test

      - name: Run the benchmark mad-dom integration suite
        run: npm run test:integration

  bench:
    name: Performance gate (benchmark vs baseline)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Install pinned Bun version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install pinned dependencies
        run: npm ci

      - name: Build native binding (dev artifact)
        run: npm run dev:build

      - name: Run the performance gate against the recorded baseline
        run: npm run bench:check
